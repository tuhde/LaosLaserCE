name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build python3-venv
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Develop
      - name: Build
        run: ninja -C build laser iotest
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/laser.bin
            build/iotest.bin
