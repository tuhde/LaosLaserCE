name: Release

# Push a tag like v1.0.0 to build the firmware and publish it as a GitHub release.
# Built with the Develop profile, the one tested on the hardware (Release is untested).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install toolchain
        run: |
          # the runner images take their apt mirror from /etc/apt/apt-mirrors.txt (azure.archive.ubuntu.com),
          # which is unreliable: use the main archive instead
          sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#; s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          grep -rhE '^(URIs|deb )' /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || true
          echo 'Acquire::Retries "5"; Acquire::http::Timeout "20"; Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99retries
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build python3-venv
      - name: Configure
        run: cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Develop
      - name: Build
        run: ninja -C build laser iotest
      - name: Collect files
        run: |
          mkdir dist
          cp build/laser.bin dist/laoslaser-${GITHUB_REF_NAME}.bin
          cp build/iotest.bin dist/iotest-${GITHUB_REF_NAME}.bin
          (cd dist && sha256sum *.bin > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
